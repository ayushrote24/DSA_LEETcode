name: Refresh LeetCode dashboard

on:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC (07:47 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public LeetCode profile statistics
        env:
          LEETCODE_USERNAME: ayushrote24
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_leetcode_readme.py
